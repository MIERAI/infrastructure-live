# Host layer of the laptop cluster ("the cloud") and of the lab cluster (xiaoxin). Idempotent; the platform on top is
# tofu/laptop and tofu/lab.
#   cd ansible && ansible-galaxy collection install -r requirements.yml && ansible-playbook site.yml [--check --diff]
#   only some parts: --tags disk,k3s,seaweedfs,kubeconfig,runner,lab,watch,dashboards   only one cluster: --limit laptop / --limit lab
# Note: the k3s.orchestration server role restarts k3s on every run (~30 s without API; pods keep running).
- name: Backup disk
  hosts: server
  become: true
  roles: [{ role: backup_disk, tags: disk }]

- name: k3s (official k3s-io/k3s-ansible)
  hosts: server
  become: true
  pre_tasks:
    # The role always runs /usr/local/bin/k3s-install.sh but downloads it only for a new / older k3s: a host installed
    # without the role (or with the script elsewhere) needs it in place to be adopted.
    - name: k3s install script in the place the role expects
      ansible.builtin.get_url: { url: https://get.k3s.io/, dest: /usr/local/bin/k3s-install.sh, mode: "0755", force: false }
      tags: k3s
  roles:
    - { role: k3s.orchestration.prereq, tags: k3s }
    - { role: k3s.orchestration.k3s_server, tags: k3s }

- name: Object storage outside the cluster
  hosts: server
  become: true
  roles: [{ role: seaweedfs, tags: seaweedfs }]

- name: Kubeconfig on the workstation
  hosts: server
  become: true
  roles: [{ role: kubeconfig, tags: kubeconfig }]

- name: GitHub Actions runner (private repository only)
  hosts: server
  become: true
  roles: [{ role: gh_runner, tags: runner }]

- name: Lab cluster (k3s on xiaoxin, its own cluster)
  hosts: lab
  become: true
  tags: lab
  pre_tasks:
    - name: k3s install script in the place the role expects
      ansible.builtin.get_url: { url: https://get.k3s.io/, dest: /usr/local/bin/k3s-install.sh, mode: "0755", force: false }
    # Ubuntu's default (128) is too few inotify instances for ~80 pods (Argo CD, Prometheus, Chaos Mesh watch files)
    - name: inotify limits
      ansible.posix.sysctl: { name: "{{ item.name }}", value: "{{ item.value }}", sysctl_file: /etc/sysctl.d/90-k3s-lab.conf }
      loop: [{ name: fs.inotify.max_user_instances, value: "512" }, { name: fs.inotify.max_user_watches, value: "524288" }]
    # AppArmor 5 (Ubuntu 26.04) labels container processes "cri-containerd.apparmor.d//&unconfined", a peer
    # containerd's default profile does not allow signals to: PostgreSQL could not signal its own processes and
    # restarted in a loop. Our copy of the profile (files/) is loaded at boot, before k3s; containerd keeps a
    # profile of that name when one is loaded.
    - name: containerd's AppArmor profile, allowing signals within a container
      ansible.builtin.copy: { src: files/cri-containerd.apparmor.d, dest: /etc/apparmor.d/cri-containerd.apparmor.d, mode: "0644" }
      register: profile
    - name: load it
      when: profile.changed
      ansible.builtin.command: apparmor_parser -r -W /etc/apparmor.d/cri-containerd.apparmor.d
    # Key-only ssh (the laptop has the same settings in its own drop-in). A drop-in, validated before it is used:
    # sshd takes the first value it reads and sshd_config includes sshd_config.d/*.conf at the top.
    - name: sshd key-only login
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-key-only.conf
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
        content: |
          # Key-only login. Managed by infrastructure-live (ansible site.yml, lab play).
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
      register: sshd_dropin
    - name: reload sshd
      when: sshd_dropin.changed
      ansible.builtin.systemd_service: { name: ssh, state: reloaded }
  roles:
    - k3s.orchestration.prereq
    - k3s.orchestration.k3s_server
    - kubeconfig

- name: Off-site backup target (phone)
  hosts: offsite
  roles: [{ role: offsite_target, tags: offsite }]

- name: The watcher of the watchers (phone)
  hosts: offsite
  roles: [{ role: gitops_watch, tags: watch }]

- name: The phone's Grafana dashboards in the laptop Grafana (JSON read from the phone, never committed)
  hosts: offsite
  roles: [{ role: phone_dashboards, tags: dashboards }]

- name: Detection alerting on the phone (Loki's ruler and an Alertmanager next to it, security-platform detections)
  hosts: offsite
  roles: [{ role: detection_alerting, tags: detection }]
