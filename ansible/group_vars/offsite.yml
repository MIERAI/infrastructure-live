offsite_dir: backups/gitops     # under the Termux home
# public half of secrets/laptop.sops.yaml offsite.ssh_private_key (used by the laptop cluster's offsite-backup CronJob)
offsite_pubkey: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOMjlZOtqOuLmaAX8ImkQfLjcVWqzsQLYOceRA3ym5Av gitops-offsite-backup

# gitops_watch: the phone watches the laptop, xiaoxin and winpc from outside; speaks on the other machine (speakd :8770)
gitops_watch_dir: "{{ ansible_env.HOME }}/gitops-watch"
gitops_watch_job_id: 30
gitops_watch_config:
  port: 9195
  interval: 30
  quiet: "21-8"
  tz_offset_hours: 9
  repeat_hours: 12
  speakers:
    xiaoxin: "http://{{ hostvars.xiaoxin.tailscale_ip }}:8770/"
    laptop: "http://{{ hostvars.laptop.tailscale_ip }}:8770/"
  # POST /notify: Gatus on this phone (~/gatus, installed by hand, not by this repository) owns the endpoint checks (the laptop's services,
  # certificate expiry) and its status page; its alerts are announced here. group (Gatus endpoint group) → which
  # machine speaks, and which check of ours hides them (the machine itself unreachable: one sentence, not one each).
  notify:
    via: { laptop: xiaoxin, lab: laptop, security: laptop }   # security: detection pages without a cluster (hosts, SaaS)
    depends: { laptop: laptop, lab: lab }
  checks:
    - id: laptop
      kind: tcp
      target: "{{ hostvars.laptop.tailscale_ip }}:22"
      say_via: xiaoxin
      down_text: 笔记本连不上了，整台机器可能宕机或者断网，生产服务都访问不了。
      up_text: 笔记本恢复连接了。
    # storefront / sample-app from outside: Gatus since 2026-11-23 (POST /notify above)
    - id: watchdog             # POST /watchdog: Alertmanager's Watchdog (gitops-manifests clusters/laptop)
      kind: heartbeat
      max_age: 600              # Watchdog arrives every minute
      depends: laptop
      say_via: xiaoxin
      down_text: 笔记本的告警系统超过十分钟没有心跳，出了问题可能不会播报。
      up_text: 笔记本的告警系统恢复了。
    - id: xiaoxin
      kind: tcp
      target: "{{ hostvars.xiaoxin.tailscale_ip }}:22"
      say_via: laptop
      down_text: 小新连不上了，测试环境停了。
      up_text: 小新恢复连接了。
    - id: lab
      kind: reachable
      target: "https://{{ hostvars.xiaoxin.tailscale_ip }}:6443/livez"
      depends: xiaoxin
      say_via: laptop
      down_text: 小新上的测试集群没有响应。
      up_text: 小新上的测试集群恢复了。
    - id: lab-watchdog         # POST /lab-watchdog: the lab Alertmanager's Watchdog (gitops-manifests platform.yaml lab)
      kind: heartbeat
      max_age: 600
      depends: lab
      say_via: laptop
      down_text: 小新的告警系统超过十分钟没有心跳，测试集群的告警可能停了。
      up_text: 小新的告警系统恢复了。
    - id: gatus                # the endpoint checker on this phone (~/gatus): down = nobody checks the services
      kind: http
      target: "http://100.80.225.15:8085/health"
      say_via: laptop
      down_text: 手机上的外部检查 Gatus 停了，生产服务现在没人从外面检查。
      up_text: 手机上的外部检查 Gatus 恢复了。
    # winpc: the consumer side — the laptop's users from outside (k6) and the prober of the
    # laptop's external probe SLOs (blackbox_exporter :9115, Windows tasks ExternalUsers / ExternalProber). winpc
    # down = those SLOs go absent (a ticket on the laptop): this says which machine. Not in the inventory (not
    # managed by Ansible): its Tailscale address.
    - id: winpc
      kind: tcp
      target: "100.106.140.35:22"
      say_via: laptop
      down_text: winpc 连不上了，外部探测和外部用户流量都停了。
      up_text: winpc 恢复连接了。
    - id: prober
      kind: http
      target: "http://100.106.140.35:9115/-/healthy"
      depends: winpc
      say_via: laptop
      down_text: winpc 上的外部探测器没有响应，笔记本的外部探测会变成没有数据。
      up_text: winpc 上的外部探测器恢复了。

# detection_alerting: page-severity detections → the watcher's /alertmanager (spoken like its own events; the lab is
# recorded only; quiet hours apply)
detection_page_webhook: http://127.0.0.1:9195/alertmanager
