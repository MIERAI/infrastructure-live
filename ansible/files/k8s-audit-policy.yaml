# Kubernetes API audit policy: a copy of security-platform detections/k8s-audit/policy.yaml (detections 0.1.0).
# Update both together. Installed by ansible (site.yml) to /etc/rancher/k3s/audit-policy.yaml.
# Kubernetes API audit policy (component `detections`, see ../VERSION). Generic: any distribution, any version
# with audit.k8s.io/v1. The first matching rule wins.
#
# Levels, and why:
#   - Request       pod exec/attach/port-forward, RBAC objects, ServiceAccount tokens: we need WHAT was asked
#                   (command, the binding's subjects), not only that something happened.
#   - Metadata      Secrets, ConfigMaps, TokenReviews and everything else that changes state: who / what / when /
#                   result. NEVER Request for Secrets: the request body would carry the secret values into the log
#                   store (a leak of its own). Same for ConfigMaps (they often hold credentials by mistake).
#   - None          read-only noise of the control plane itself (leases, events, health, node status, controller
#                   watches), which is where almost all the volume is; humans' and workloads' reads stay in.
# omitStages RequestReceived: one line per request (ResponseComplete / Panic), half the volume.
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages: [RequestReceived]
rules:
  # ---- drop: high volume, no detection value ----------------------------------------------------------------
  - level: None
    nonResourceURLs: [/healthz*, /livez*, /readyz*, /version, /version/, /metrics, /openapi*, /api, /api/*, /apis, /apis/*]
  - level: None
    resources: [{group: coordination.k8s.io, resources: [leases]}]
  - level: None
    resources: [{group: "", resources: [events]}, {group: events.k8s.io, resources: [events]}]
  - level: None
    users: [system:kube-proxy, system:kube-scheduler, system:kube-controller-manager, system:apiserver]
    verbs: [get, list, watch]
  - level: None
    userGroups: [system:nodes]
    verbs: [get, list, watch]
  - level: None
    userGroups: [system:nodes]
    resources: [{group: "", resources: [nodes/status, pods/status]}]
  # controllers' own watches and list calls (service accounts): reads only; writes and Secret reads stay below
  - level: None
    userGroups: [system:serviceaccounts]
    verbs: [watch]
  # ---- what detection needs ----------------------------------------------------------------------------------
  - level: Request
    resources: [{group: "", resources: [pods/exec, pods/attach, pods/portforward, pods/ephemeralcontainers, nodes/proxy, serviceaccounts/token]}]
  - level: Metadata
    resources: [{group: "", resources: [secrets, configmaps]}, {group: authentication.k8s.io, resources: [tokenreviews]}]
  - level: Request
    resources: [{group: rbac.authorization.k8s.io}, {group: admissionregistration.k8s.io}, {group: certificates.k8s.io, resources: [certificatesigningrequests]}]
    verbs: [create, update, patch, delete, deletecollection, escalate, bind, impersonate]
  - level: Metadata
    users: [system:anonymous]
  - level: Metadata
    verbs: [create, update, patch, delete, deletecollection]
  # remaining reads by service accounts: frequent and expected (controllers); humans' reads stay in
  - level: None
    userGroups: [system:serviceaccounts]
    verbs: [get, list]
  - level: Metadata
