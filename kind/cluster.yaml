# 本地的 Kubernetes 集群(代替 GKE)。NodePort 30080-30089 映射到本机 18080-18089
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: gitops
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: 18080 }   # api-factory dev
      - { containerPort: 30081, hostPort: 18081 }   # api-factory prod
      - { containerPort: 30082, hostPort: 18082 }   # sample-app dev
      - { containerPort: 30083, hostPort: 18083 }   # sample-app prod
