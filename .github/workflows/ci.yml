# lint: OpenTofu (fmt / validate) + Ansible (syntax) + scripts (shellcheck)
# e2e: the demo (tofu/demo) on the GitHub runner, exactly as its README tells anyone: every Application healthy
name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"   # weekly: upstream (charts, providers, kind) may break even without a change here
  workflow_dispatch:
permissions:
  contents: read
env:
  TOFU_VERSION: 1.13.9
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v1
        with: { tofu_version: "${{ env.TOFU_VERSION }}" }
      - name: state passphrase (throwaway, validate evaluates the encryption block)
        run: |
          d="$HOME/Library/Application Support/gitops"; mkdir -p "$d/tofu"
          openssl rand -base64 33 > "$d/tofu-state.passphrase"
      - run: tofu fmt -check -recursive tofu
      - run: for r in kind laptop demo; do tofu -chdir=tofu/$r init -backend=false -input=false >/dev/null && tofu -chdir=tofu/$r validate; done
      - run: shellcheck scripts/*.sh
      - name: ansible syntax
        working-directory: ansible
        run: |
          pipx install --include-deps ansible-core >/dev/null
          ansible-galaxy collection install -r requirements.yml >/dev/null
          ansible-playbook site.yml --syntax-check
  # the demo exactly as tofu/demo/README.md tells anyone to run it: no keys, no tokens → every Application healthy
  e2e:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v1
        with: { tofu_version: "${{ env.TOFU_VERSION }}", tofu_wrapper: false }
      - name: tofu apply (the demo)
        run: |
          tofu -chdir=tofu/demo init -input=false >/dev/null
          tofu -chdir=tofu/demo apply -auto-approve -input=false
      - run: TARGET=demo scripts/wait-synced.sh --healthy --timeout 1200 --expect 16
      - name: sample-app answers
        run: curl -fsS localhost:28082/hello && curl -fsS localhost:28083/hello
      - if: failure()
        name: diagnostics
        env: { KUBECONFIG: /home/runner/.kube/gitops-demo.yaml }
        run: |
          kubectl get applications -n argocd -o wide || true
          kubectl -n argocd get applications -o jsonpath='{range .items[*]}{.metadata.name}: {.status.conditions}{"\n"}{end}' || true
          kubectl get pods -A || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -40 || true
