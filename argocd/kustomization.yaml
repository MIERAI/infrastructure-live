# Argo CD(固定版本的官方清单)+ 本地用的设定
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.6/manifests/install.yaml
patches:
  # 本地(kind on OrbStack)不装 Argo CD 自带的 NetworkPolicy: kindnet 的 NetworkPolicy 实现在这个环境里
  # 把被选中的 pod 的入站全部丢掉(DNS 的回包、允许的来源的 TCP 都超时)→ 控制器连不上 redis / repo-server。
  # GKE(Dataplane V2)上保留这些策略。
  - target: { kind: NetworkPolicy }
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: { name: any }
  # 轮询 Git 的间隔(默认 3 分钟;本地没有 webhook,缩短到 30 秒)
  - target: { kind: ConfigMap, name: argocd-cm }
    patch: |-
      - op: add
        path: /data
        value:
          timeout.reconciliation: 30s
  # 本地用 port-forward 访问 UI: 不用 TLS
  - target: { kind: ConfigMap, name: argocd-cmd-params-cm }
    patch: |-
      - op: add
        path: /data
        value:
          server.insecure: "true"
